<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dApp profile - Monad Atlas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-profile">

  <canvas id="galaxy-canvas"></canvas>

  <header class="topbar">
    <div class="topbar-inner shell">
      <div class="brand">
        <div class="brand-mark">
          <img src="icons/monad_logo.png" class="brand-logo" alt="Monad logo" />
        </div>
        <div class="brand-text">
          <a class="brand-title brand-link" href="index.html">Monad Atlas</a>
          <span class="brand-subtitle">dApp profile</span>
        </div>
      </div>
      <a href="index.html" class="secondary-button back-button">← Back to Atlas</a>
    </div>
  </header>

  <main class="shell main main-profile">
    <div id="profile-root" class="profile-root">
      <div class="profile-loading">Loading dApp profile…</div>
    </div>
  </main>

  <script src="galaxy.js"></script>

  <script src="profile.js"></script>

</body>
</html>

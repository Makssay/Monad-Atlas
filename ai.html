<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Search - Monad Atlas</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <canvas id="galaxy-canvas"></canvas>

  <header>
    <div class="brand">
      <div class="brand-mark">
        <img src="icons/monad_logo.png" class="brand-logo" />
      </div>
      <div class="brand-text">
        <a class="brand-title">Monad Atlas</a>
        <span class="brand-subtitle">AI-powered discovery</span>
      </div>
    </div>

    <nav class="top-nav">
      <a href="index.html" class="top-nav-button">All dApps</a>
    </nav>
  </header>

  <main class="ai-shell">

    <section class="ai-hero">
      <h1>AI Search</h1>
      <p>
        Find the most relevant dApps apps by meaning
      </p>
    </section>

    <section class="ai-search">
      <div class="ai-row">
        <input id="ai-input" type="text" 
          placeholder="Ask AI... " />
        <button id="ai-search-btn">Search</button>
      </div>

      <div id="ai-results" class="ai-grid"></div>

    </section>

  </main>

  <script src="galaxy.js"></script>
  <script src="script.js"></script>
</body>
</html>
